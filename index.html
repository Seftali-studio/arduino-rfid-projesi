<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino RFID Kart Otomasyonu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 340px; }
        .balance { font-size: 32px; color: #2e7d32; font-weight: bold; margin: 15px 0; }
        .status { padding: 8px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; background: #fff3cd; color: #856404; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Yemekhane / Kart Sistemi</h2>
        <div id="connectionStatus" class="status">Arduino Bağlı Değil</div>
        <button onclick="connectArduino()" style="background: #17a2b8;">Arduino'ya Bağlan</button>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <p><strong>Okunan Kart ID:</strong> <span id="cardId">--</span></p>
        <p><strong>Kullanıcı:</strong> <span id="userName">Kart Bekleniyor...</span></p>
        <div class="balance" id="bakiye">0 TL</div>
    </div>

    <script>
        // Kendi kartını ve diğer tanımlı kartları buraya ekleyebilirsin
        const users = {
            "7A:05:30:A5": { name: "Furkan", balance: 200 },
            "7A0530A5": { name: "Furkan", balance: 200 },
            "1001": { name: "Ahmet Yılmaz", balance: 100 }
        };

        async function connectArduino() {
            if ("serial" in navigator) {
                try {
                    const port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 9600 });
                    document.getElementById('connectionStatus').innerText = "Arduino Bağlandı! Kart Bekleniyor...";
                    document.getElementById('connectionStatus').style.background = "#d4edda";
                    document.getElementById('connectionStatus').style.color = "#155724";

                    const textDecoder = new TextDecoderStream();
                    const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                    const reader = textDecoder.readable.getReader();

                    let buffer = "";
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buffer += value;
                        let lines = buffer.split("\n");
                        buffer = lines.pop();

                        for (let line of lines) {
                            let cleanId = line.trim();
                            if (cleanId.length > 0) {
                                processCard(cleanId);
                            }
                        }
                    }
                } catch (err) {
                    alert("Bağlantı Hatası: " + err);
                }
            } else {
                alert("Tarayıcınız Web Serial API desteklemiyor. Lütfen Google Chrome veya Microsoft Edge kullanın.");
            }
        }

        function processCard(cardId) {
            document.getElementById('cardId').innerText = cardId;
            
            // Eğer kart veritabanında yoksa otomatik ekle
            if (!users[cardId]) {
                users[cardId] = { name: "Yeni Kullanıcı (" + cardId + ")", balance: 150 };
            }

            let user = users[cardId];
            document.getElementById('userName').innerText = user.name;

            // Bakiyeden 20 TL Biniş/Yemek Ücreti Düş
            if (user.balance >= 20) {
                user.balance -= 20;
                document.getElementById('bakiye').innerText = user.balance + " TL";
            } else {
                alert("Yetersiz Bakiye! Lütfen yükleme yapın.");
                document.getElementById('bakiye').innerText = user.balance + " TL";
            }
        }
    </script>
</body>
</html>
